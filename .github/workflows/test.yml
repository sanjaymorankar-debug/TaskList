name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tasklist
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          POSTGRES_DB: tasklist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasklist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TASKLIST_TEST_DATABASE_URL: postgres://tasklist:ci-only-not-a-real-password@localhost:5432/tasklist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
